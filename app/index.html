<style>
  :root{
    /* Nura brand system: Ink / Navy / Paper / Stone. Semantic status colors
       (teal/amber/coral below) are a functional exception the brand board doesn't
       define — kept muted and separate from the four brand colors, not decorative. */
    --ink:#0A0F17;
    --navy:#14213D;
    --paper:#F7F7F5;
    --stone:#6B7280;

    --bg:var(--ink);
    --bezel:#121824;
    --panel:#101520;
    --panel-2:#151B28;
    --border:rgba(247,247,245,0.12);
    --text-primary:var(--paper);
    --text-secondary:#9AA3AF; /* Stone, lightened for legibility on Ink */
    --text-muted:#5D6672;
    --accent:var(--navy);
    --accent-tint:#3E5A87; /* Navy lightened — the only non-brand-literal tint, for interactive contrast on dark */
    --teal:#3F9668;
    --teal-dim:#152A1F;
    --amber:#C99A3E;
    --amber-dim:#332811;
    --coral:#C1503E;
    --coral-dim:#331813;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text-primary);font-family:'Satoshi',sans-serif;}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 20px 60px;}

  .presenter{width:100%;max-width:1180px;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .presenter-label{font-family:'Satoshi',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);}
  .scenario-switch{display:flex;gap:8px;}
  .scenario-btn{background:var(--panel);border:1px solid var(--border);color:var(--text-secondary);font-family:'Satoshi',sans-serif;font-size:13px;font-weight:500;padding:8px 14px;border-radius:20px;cursor:pointer;transition:.15s, transform .15s ease;}
  .scenario-btn:hover{transform:translateY(-1px);}
  .scenario-btn:hover{border-color:var(--text-muted);color:var(--text-primary);}
  .scenario-btn.active{background:var(--text-primary);color:var(--bg);border-color:var(--text-primary);}

  .stage{width:100%;max-width:1180px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:24px;align-items:start;}

  .principles-strip{width:100%;max-width:1180px;display:flex;margin-top:28px;padding-top:24px;border-top:1px solid var(--border);}
  .principle-item{display:flex;align-items:flex-start;gap:10px;flex:1;padding:0 20px;}
  .principle-item:first-child{padding-left:0;}
  .principle-item:not(:first-child){border-left:1px solid var(--border);}
  .principle-title{font-weight:600;font-size:13.5px;}
  .principle-desc{font-size:12px;color:var(--text-secondary);margin-top:2px;}
  @media(max-width:760px){.principles-strip{flex-direction:column;gap:16px;} .principle-item{border-left:none !important;padding-left:0;}}
  @media (max-width:880px){.stage{grid-template-columns:1fr;}}

  .device{background:var(--bezel);border-radius:28px;padding:14px;border:1px solid var(--border);}
  .screen{background:var(--bg);border-radius:18px;min-height:600px;padding:32px 30px 26px;display:flex;flex-direction:column;position:relative;overflow:hidden;}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;}
  .brand{display:flex;align-items:center;gap:7px;font-family:'Satoshi',sans-serif;font-size:15px;font-weight:600;letter-spacing:-.01em;}
  .logo-mark{color:var(--text-primary);flex-shrink:0;}
  .shift-pill{font-family:'Satoshi',sans-serif;font-size:11px;letter-spacing:.03em;color:var(--text-muted);border:1px solid var(--border);padding:5px 10px;border-radius:12px;}

  .step-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(10px) scale(.985);}to{opacity:1;transform:translateY(0) scale(1);}}

  .eyebrow{font-family:'Satoshi',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);}
  h1{font-family:'Satoshi',sans-serif;font-size:26px;font-weight:600;margin:6px 0 0;line-height:1.25;}
  .sub{color:var(--text-secondary);font-size:14px;line-height:1.6;margin-top:4px;max-width:440px;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px 22px;}
  .card-row{display:flex;justify-content:space-between;align-items:center;}
  .meta{font-family:'Satoshi',sans-serif;font-size:12px;letter-spacing:.03em;color:var(--text-muted);margin-top:8px;}

  .btn{font-family:'Satoshi',sans-serif;font-size:15px;font-weight:600;border:none;border-radius:14px;padding:16px 20px;cursor:pointer;transition:.15s, transform .15s ease;width:100%;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--text-primary);color:var(--bg);}
  .btn-primary:hover{opacity:.9;}
  .btn-outline{background:transparent;color:var(--text-primary);border:1px solid var(--border);}
  .btn-outline:hover{border-color:var(--text-muted);}
  .btn-teal{background:var(--teal);color:#06231a;}
  .btn-coral{background:var(--coral);color:#2c0f08;}

  .ring-wrap{display:flex;align-items:center;gap:20px;}
  .ring-label{font-size:13px;color:var(--text-secondary);}
  .ring-label b{display:block;color:var(--text-primary);font-size:15px;font-weight:600;margin-bottom:2px;}

  @keyframes statusPop{0%{opacity:0;transform:scale(.85);}70%{transform:scale(1.03);}100%{opacity:1;transform:scale(1);}}
  @media (prefers-reduced-motion: no-preference){ .status{animation:statusPop .4s cubic-bezier(.16,1,.3,1) both;} }
  .status{display:inline-flex;align-items:center;gap:8px;font-family:'Satoshi',sans-serif;font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:6px 12px;border-radius:20px;width:fit-content;}
  .dot{width:7px;height:7px;border-radius:50%;}
  .status-ready{background:var(--teal-dim);color:var(--teal);}
  .status-ready .dot{background:var(--teal);}
  .status-blocked{background:var(--coral-dim);color:var(--coral);}
  .status-blocked .dot{background:var(--coral);}
  .status-pending{background:var(--amber-dim);color:var(--amber);}
  .status-pending .dot{background:var(--amber);}

  .checklist{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
  .check-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-secondary);}
  @media (prefers-reduced-motion: no-preference){
    .check-item{opacity:0;animation:fade .4s ease both;}
    .check-item:nth-of-type(1){animation-delay:.08s;}
    .check-item:nth-of-type(2){animation-delay:.16s;}
    .check-item:nth-of-type(3){animation-delay:.24s;}
  }
  .check-item.ok{color:var(--text-primary);}
  .check-item.fail{color:var(--coral);}
  .check-icon{width:16px;height:16px;flex-shrink:0;}

  .slide-track{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:30px;height:56px;display:flex;align-items:center;padding:0 6px;cursor:pointer;overflow:hidden;}
  .slide-fill{position:absolute;inset:0;background:var(--teal);width:0%;transition:width .5s ease;}
  .slide-text{position:relative;z-index:2;width:100%;text-align:center;font-size:14px;font-weight:600;color:var(--text-secondary);}

  .footer-nav{display:flex;gap:10px;margin-top:24px;}

  .evidence{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px 18px 10px;display:flex;flex-direction:column;height:100%;min-height:600px;}
  .evidence h2{font-family:'Satoshi',sans-serif;font-size:14px;font-weight:600;margin:0 0 2px;}
  .evidence-sub{font-size:12px;color:var(--text-muted);margin-bottom:14px;}
  .log{display:flex;flex-direction:column-reverse;gap:0;overflow-y:auto;flex:1;padding-right:4px;}
  .log-entry{font-family:'Satoshi',sans-serif;font-size:11.5px;letter-spacing:.01em;line-height:1.6;color:var(--text-secondary);border-left:2px solid var(--border);padding:8px 0 8px 12px;margin-bottom:2px;animation:fade .3s ease;}
  @keyframes logFlash{0%{background:rgba(247,247,245,.08);transform:translateX(-4px);}100%{background:transparent;transform:translateX(0);}}
  @media (prefers-reduced-motion: no-preference){ .log-new{animation:logFlash 1.1s ease both;} }
  .log-entry b{color:var(--text-primary);font-weight:500;}
  .log-entry.warn{border-left-color:var(--amber);}
  .log-entry.warn b{color:var(--amber);}
  .log-entry.block{border-left-color:var(--coral);}
  .log-entry.block b{color:var(--coral);}
  .log-entry.ready{border-left-color:var(--teal);}
  .log-entry.ready b{color:var(--teal);}
  .log::-webkit-scrollbar{width:5px;}
  .log::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .splash{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease;z-index:5;}
  .splash.fade-out{opacity:0;pointer-events:none;}
  .splash img{width:56px;height:56px;}
  .splash-word{font-family:'Satoshi',sans-serif;font-weight:600;font-size:20px;letter-spacing:.22em;color:var(--text-primary);}
</style>
</head>

<script>
const ICON = {
  ok: '<svg class="check-icon" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.3"/><path d="M5 8.2L7 10.2L11 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  fail: '<svg class="check-icon" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.3"/><path d="M6 6L10 10M10 6L6 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  pending: '<svg class="check-icon" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 2.4"/></svg>'
};

const SCENARIOS = {
  normal: { label: 'Normal visit' },
  location: { label: 'Location mismatch' },
  missing: { label: 'Missing confirmation' }
};

let scenario = 'normal';
let step = 0;
let clock = 9 * 60 + 12; // minutes since midnight, demo clock
let logs = [];

function tick(mins){ clock += mins; return fmtClock(); }
function fmtClock(){
  const h = String(Math.floor(clock/60)).padStart(2,'0');
  const m = String(clock%60).padStart(2,'0');
  return h+':'+m;
}

function pushLog(text, cls){
  logs.push({t: fmtClock(), text, cls});
  renderLog();
}
function renderLog(){
  const el = document.getElementById('log');
  el.innerHTML = logs.map((l, i) =>
    `<div class="log-entry ${l.cls||''} ${i===logs.length-1 ? 'log-new' : ''}"><b>${l.t}</b> — ${l.text}</div>`
  ).join('');
  el.scrollTop = 0;
}

let ringAnimCounter = 0;
let lastRingAnim = null;
function ring(pct, color){
  const r = 30, c = 2*Math.PI*r;
  const dash = c*pct/100;
  const animName = `ringGrow${ringAnimCounter++}`;
  lastRingAnim = { id: animName, pct };
  return `<svg width="76" height="76" viewBox="0 0 76 76">
    <style>
      @keyframes ${animName}{from{stroke-dasharray:0 ${c};}to{stroke-dasharray:${dash} ${c};}}
      @media (prefers-reduced-motion: no-preference){
        .${animName}{animation:${animName} .9s cubic-bezier(.16,1,.3,1) .1s both;}
      }
    </style>
    <circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--border)" stroke-width="6"/>
    <circle class="${animName}" cx="38" cy="38" r="${r}" fill="none" stroke="${color}" stroke-width="6"
      stroke-dasharray="${dash} ${c}" stroke-linecap="round" transform="rotate(-90 38 38)"/>
    <text id="${animName}_text" x="38" y="43" text-anchor="middle" font-family="Satoshi" font-size="16" font-weight="600" fill="var(--text-primary)">0%</text>
  </svg>`;
}

function animateRingCount(){
  if(!lastRingAnim) return;
  const { id, pct } = lastRingAnim;
  const textEl = document.getElementById(id + '_text');
  if(!textEl) return;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){ textEl.textContent = pct + '%'; return; }
  const duration = 900, start = performance.now();
  function tick(now){
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    textEl.textContent = Math.round(eased * pct) + '%';
    if(t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function resetScenario(newScenario){
  scenario = newScenario;
  step = 0;
  clock = 9*60 + 12;
  logs = [];
  renderScenarioSwitch();
  render();
}

function renderScenarioSwitch(){
  const el = document.getElementById('scenarioSwitch');
  el.innerHTML = Object.entries(SCENARIOS).map(([key, s]) =>
    `<button class="scenario-btn ${key===scenario?'active':''}" onclick="resetScenario('${key}')">${s.label}</button>`
  ).join('');
}

function next(){ step++; render(); }

function render(){
  const el = document.getElementById('screen');
  el.innerHTML = topbar() + body();
  if(step === 2){ animateRingCount(); }
}

function topbar(){
  return `<div class="topbar">
    <div class="brand">${LOGO_MARK}<span style="letter-spacing:.06em;">NURA</span></div>
    <div class="shift-pill">shift 07:00–15:00 · ${fmtClock()}</div>
  </div>`;
}

function body(){
  // STEP 0 — shift start
  if(step===0){
    return `<div class="step-body">
      <div class="eyebrow">start of shift</div>
      <h1>Good morning.</h1>
      <div class="sub">6 visits scheduled today. Nura will guide you through each one.</div>
      <button class="btn btn-primary" onclick="startShift()">Start shift</button>
    </div>`;
  }
  // STEP 1 — next visit
  if(step===1){
    return `<div class="step-body">
      <div class="eyebrow">next visit</div>
      <h1>Patient M.K.</h1>
      <div class="sub">Musterstraße 12, 3rd floor</div>
      <div class="card" style="margin-top:6px;">
        <div class="card-row">
          <div>
            <div style="font-weight:600;font-size:15px;">Grundpflege · SGB XI §36</div>
            <div class="meta">Scheduled 09:15 – 09:45</div>
          </div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="arrive()">I've arrived</button>
    </div>`;
  }
  // STEP 2 — verification
  if(step===2){
    if(scenario==='location'){
      return `<div class="step-body">
        <div class="eyebrow">visit verification</div>
        <h1>Confidence is low.</h1>
        <div class="sub">Location doesn't clearly match the scheduled address. This building has multiple patients — Nura won't guess.</div>
        <div class="ring-wrap">
          ${ring(41,'var(--amber)')}
          <div class="ring-label"><b>Low confidence</b>GPS uncertain · schedule matches · user matches</div>
        </div>
        <button class="btn btn-outline" onclick="confirmVerification()">Confirm patient manually</button>
      </div>`;
    }
    return `<div class="step-body">
      <div class="eyebrow">visit verification</div>
      <h1>Confidence is high.</h1>
      <div class="sub">GPS, schedule, time window and caregiver identity all agree.</div>
      <div class="ring-wrap">
        ${ring(96,'var(--teal)')}
        <div class="ring-label"><b>High confidence</b>Continuing automatically</div>
      </div>
      <button class="btn btn-primary" onclick="confirmVerification()">Continue</button>
    </div>`;
  }
  // STEP 3 — perform service
  if(step===3){
    return `<div class="step-body">
      <div class="eyebrow">service</div>
      <h1>Grundpflege</h1>
      <div class="sub">Basic care — washing, dressing, mobility support.</div>
      <button class="btn btn-primary" onclick="markPerformed()">Mark service performed</button>
    </div>`;
  }
  // STEP 4 — confirmation slide
  if(step===4){
    if(scenario==='missing'){
      return `<div class="step-body">
        <div class="eyebrow">confirmation</div>
        <h1>Skip confirmation?</h1>
        <div class="sub">This visit will proceed without a captured confirmation — for this demo, to show what Nura catches next.</div>
        <button class="btn btn-outline" onclick="skipConfirmation()">Continue without confirming</button>
      </div>`;
    }
    return `<div class="step-body">
      <div class="eyebrow">confirmation</div>
      <h1>Confirm completion.</h1>
      <div class="sub">Slide to confirm the service was performed as documented.</div>
      <div class="slide-track" onclick="slideConfirm()">
        <div class="slide-fill" id="slideFill"></div>
        <div class="slide-text" id="slideText">Slide to confirm →</div>
      </div>
    </div>`;
  }
  // STEP 5 — validation result
  if(step===5){
    if(scenario==='missing'){
      return `<div class="step-body">
        <div class="status status-blocked"><span class="dot"></span>BILLING BLOCKED</div>
        <h1>Missing confirmation.</h1>
        <div class="sub">This service can't become a claim yet. One requirement is unmet.</div>
        <div class="checklist">
          <div class="check-item ok">${ICON.ok} Correct patient &amp; visit</div>
          <div class="check-item ok">${ICON.ok} Correct service &amp; time</div>
          <div class="check-item fail">${ICON.fail} Confirmation of completion</div>
        </div>
        <button class="btn btn-coral" onclick="fixConfirmation()">Add confirmation now</button>
      </div>`;
    }
    return `<div class="step-body">
      <div class="status status-ready"><span class="dot"></span>READY FOR BILLING</div>
      <h1>All requirements met.</h1>
      <div class="sub">Documentation is complete, validated and traceable.</div>
      <div class="checklist">
        <div class="check-item ok">${ICON.ok} Correct patient &amp; visit</div>
        <div class="check-item ok">${ICON.ok} Correct service &amp; time</div>
        <div class="check-item ok">${ICON.ok} Confirmation of completion</div>
      </div>
      <button class="btn btn-primary" onclick="goToNextVisit()">Next visit</button>
    </div>`;
  }
  // STEP 6 — corrected & cleared (missing-confirmation scenario only)
  if(step===6){
    return `<div class="step-body">
      <div class="status status-ready"><span class="dot"></span>READY FOR BILLING</div>
      <h1>Fixed and cleared.</h1>
      <div class="sub">The record was corrected — not overwritten. The original gap stays in the evidence chain.</div>
      <div class="checklist">
        <div class="check-item ok">${ICON.ok} Correct patient &amp; visit</div>
        <div class="check-item ok">${ICON.ok} Correct service &amp; time</div>
        <div class="check-item ok">${ICON.ok} Confirmation of completion (added retroactively)</div>
      </div>
      <button class="btn btn-primary" onclick="goToNextVisit()">Next visit</button>
    </div>`;
  }
  return '';
}

function startShift(){
  pushLog('<b>Caregiver A.</b> started shift 07:00–15:00', '');
  step = 1; render();
}

function arrive(){
  tick(3);
  pushLog('<b>Caregiver A.</b> arrived near patient M.K., Musterstraße 12', '');
  step = 2; render();
}

function confirmVerification(){
  if(scenario==='location'){
    tick(2);
    pushLog('<b>Caregiver A.</b> manually confirmed patient M.K. after low-confidence match', 'warn');
  } else {
    tick(1);
    pushLog('<b>Nura</b> verified visit — GPS + schedule + identity agree (96%)', '');
  }
  step = 3; render();
}

function markPerformed(){
  tick(18);
  pushLog('<b>Caregiver A.</b> marked Grundpflege as performed', '');
  step = 4; render();
}

function slideConfirm(){
  const fill = document.getElementById('slideFill');
  const text = document.getElementById('slideText');
  if(!fill) return;
  fill.style.width = '100%';
  text.textContent = 'Confirmed ✓';
  tick(2);
  pushLog('<b>Caregiver A.</b> confirmed completion of Grundpflege, patient M.K.', '');
  setTimeout(()=>{
    tick(1);
    pushLog('<b>Nura</b> validated documentation — READY FOR BILLING', 'ready');
    step = 5; render();
  }, 550);
}

function skipConfirmation(){
  tick(2);
  pushLog('<b>Nura</b> checked documentation — confirmation missing, BILLING BLOCKED', 'block');
  step = 5; render();
}

function fixConfirmation(){
  tick(4);
  pushLog('<b>Correction event.</b> confirmation added by Caregiver A. · reason: "forgot at point of care" · original gap retained', 'warn');
  step = 6; render();
}

function goToNextVisit(){
  tick(6);
  pushLog('— shift continues —', '');
  step = 1; render();
}

renderScenarioSwitch();
setTimeout(() => {
  const splash = document.getElementById('splash');
  if (splash) splash.classList.add('fade-out');
  setTimeout(() => { render(); }, 500);
}, 1300);
</script>
</body>
